tables:
  accounts:
    description: "Raw accounts master records"
    primary_key: ["account_id"]
    file_pattern: "raw_lake/accounts/organisation_id=*/processing_date=*/*.orc"
    columns:
      account_id: String
      account_name: String
      status: LowCardinality(String)
      currency: LowCardinality(String)
      advisor_id: String
      opened_at: String
      updated_at: String

  contacts:
    description: "Raw contact & person profiles attached to accounts"
    primary_key: ["contact_id"]
    file_pattern: "raw_lake/contacts/organisation_id=*/processing_date=*/*.orc"
    columns:
      contact_id: String
      account_id: String
      first_name: String
      last_name: String
      email: String
      phone: String
      updated_at: String

  portfolios:
    description: "Investment portfolios linked to accounts"
    primary_key: ["portfolio_id"]
    file_pattern: "raw_lake/portfolios/organisation_id=*/processing_date=*/*.orc"
    columns:
      portfolio_id: String
      account_id: String
      portfolio_name: String
      strategy: LowCardinality(String)
      risk_profile: LowCardinality(String)
      updated_at: String

  securities:
    description: "Tradable securities master catalog"
    primary_key: ["security_id"]
    file_pattern: "raw_lake/securities/organisation_id=*/processing_date=*/*.orc"
    columns:
      security_id: String
      ticker: LowCardinality(String)
      security_name: String
      asset_class: LowCardinality(String)
      currency: LowCardinality(String)
      updated_at: String

  holdings:
    description: "Daily portfolio positions and asset valuations"
    primary_key: ["holding_id"]
    file_pattern: "raw_lake/holdings/organisation_id=*/processing_date=*/*.orc"
    columns:
      holding_id: String
      portfolio_id: String
      security_id: String
      quantity: Float64
      market_value: Float64
      cost_basis: Float64
      as_of_date: String
      updated_at: String

  trades:
    description: "Executed buy/sell order fills"
    primary_key: ["trade_id"]
    file_pattern: "raw_lake/trades/organisation_id=*/processing_date=*/*.orc"
    columns:
      trade_id: String
      portfolio_id: String
      security_id: String
      side: LowCardinality(String)
      quantity: Float64
      price: Float64
      trade_value: Float64
      commission: Float64
      trade_timestamp: String
      updated_at: String

  transactions:
    description: "Cash ledger movements, cash infusions, dividends, withdrawals"
    primary_key: ["transaction_id"]
    file_pattern: "raw_lake/transactions/organisation_id=*/processing_date=*/*.orc"
    columns:
      transaction_id: String
      account_id: String
      transaction_type: LowCardinality(String)
      amount: Float64
      currency: LowCardinality(String)
      transaction_timestamp: String
      updated_at: String

  advisors:
    description: "Wealth management advisors assigned to clients"
    primary_key: ["advisor_id"]
    file_pattern: "raw_lake/advisors/organisation_id=*/processing_date=*/*.orc"
    columns:
      advisor_id: String
      advisor_name: String
      email: String
      region: LowCardinality(String)
      updated_at: String

  fee_schedules:
    description: "Account management fee tiered schedules"
    primary_key: ["fee_schedule_id"]
    file_pattern: "raw_lake/fee_schedules/organisation_id=*/processing_date=*/*.orc"
    columns:
      fee_schedule_id: String
      account_id: String
      fee_type: LowCardinality(String)
      rate: Float64
      updated_at: String

  statements:
    description: "Periodic account statement summaries"
    primary_key: ["statement_id"]
    file_pattern: "raw_lake/statements/organisation_id=*/processing_date=*/*.orc"
    columns:
      statement_id: String
      account_id: String
      statement_date: String
      total_value: Float64
      currency: LowCardinality(String)
      updated_at: String
