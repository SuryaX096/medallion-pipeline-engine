tables:
  accounts:
    description: "Raw accounts master records"
    primary_key: ["account_id"]
    file_pattern: "accounts/organisation_id=*/processing_date=*/*.orc"
    columns:
      account_id: String
      account_number: String
      account_name: String
      account_type: LowCardinality(String)
      currency: LowCardinality(String)
      status: LowCardinality(String)
      created_at: String
      updated_at: String

  contacts:
    description: "Raw contact & person profiles attached to accounts"
    primary_key: ["contact_id"]
    file_pattern: "contacts/organisation_id=*/processing_date=*/*.orc"
    columns:
      contact_id: String
      account_id: String
      first_name: String
      last_name: String
      email: String
      phone: String
      role: LowCardinality(String)
      updated_at: String

  portfolios:
    description: "Investment portfolios linked to accounts"
    primary_key: ["portfolio_id"]
    file_pattern: "portfolios/organisation_id=*/processing_date=*/*.orc"
    columns:
      portfolio_id: String
      account_id: String
      portfolio_name: String
      benchmark_code: LowCardinality(String)
      risk_tolerance: LowCardinality(String)
      is_active: Int8
      updated_at: String

  securities:
    description: "Tradable securities master catalog"
    primary_key: ["security_id"]
    file_pattern: "securities/organisation_id=*/processing_date=*/*.orc"
    columns:
      security_id: String
      symbol: LowCardinality(String)
      security_name: String
      asset_class: LowCardinality(String)
      sector: LowCardinality(String)
      exchange: LowCardinality(String)
      updated_at: String

  holdings:
    description: "Daily portfolio positions and asset valuations"
    primary_key: ["holding_id"]
    file_pattern: "holdings/organisation_id=*/processing_date=*/*.orc"
    columns:
      holding_id: String
      portfolio_id: String
      security_id: String
      quantity: Float64
      market_value: Float64
      cost_basis: Float64
      unrealized_gain_loss: Float64
      as_of_date: String
      updated_at: String

  trades:
    description: "Executed buy/sell order fills"
    primary_key: ["trade_id"]
    file_pattern: "trades/organisation_id=*/processing_date=*/*.orc"
    columns:
      trade_id: String
      portfolio_id: String
      security_id: String
      trade_type: LowCardinality(String)
      trade_status: LowCardinality(String)
      units: Float64
      execution_price: Float64
      gross_amount: Float64
      commission_fee: Float64
      executed_at: String
      updated_at: String

  transactions:
    description: "Cash ledger movements, cash infusions, dividends, withdrawals"
    primary_key: ["transaction_id"]
    file_pattern: "transactions/organisation_id=*/processing_date=*/*.orc"
    columns:
      transaction_id: String
      account_id: String
      portfolio_id: String
      transaction_type: LowCardinality(String)
      amount: Float64
      currency: LowCardinality(String)
      description: String
      effective_date: String
      updated_at: String

  advisors:
    description: "Wealth management advisors assigned to clients"
    primary_key: ["advisor_id"]
    file_pattern: "advisors/organisation_id=*/processing_date=*/*.orc"
    columns:
      advisor_id: String
      advisor_code: String
      full_name: String
      branch_code: LowCardinality(String)
      license_status: LowCardinality(String)
      updated_at: String

  fee_schedules:
    description: "Account management fee tiered schedules"
    primary_key: ["fee_schedule_id"]
    file_pattern: "fee_schedules/organisation_id=*/processing_date=*/*.orc"
    columns:
      fee_schedule_id: String
      account_id: String
      tier_name: LowCardinality(String)
      rate_bps: Float64
      min_annual_fee: Float64
      billing_frequency: LowCardinality(String)
      effective_from: String
      updated_at: String

  statements:
    description: "Periodic account statement summaries"
    primary_key: ["statement_id"]
    file_pattern: "statements/organisation_id=*/processing_date=*/*.orc"
    columns:
      statement_id: String
      account_id: String
      statement_period: String
      starting_balance: Float64
      ending_balance: Float64
      total_fees: Float64
      statement_url: String
      generated_at: String
