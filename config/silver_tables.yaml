tables:
  silver_accounts:
    description: "Normalized and deduplicated accounts with state history"
    source_table: "bronze_accounts"
    engine: "ReplacingMergeTree(updated_at)"
    primary_key: ["organisation_id", "account_id"]
    order_by: ["organisation_id", "account_id"]
    partition_by: "processing_date"
    dedup_strategy: "window_latest"
    columns:
      organisation_id: "LowCardinality(String)"
      processing_date: "Date"
      account_id: "String"
      account_number: "String"
      account_name: "String"
      account_type: "LowCardinality(String)"
      currency: "LowCardinality(String)"
      status: "LowCardinality(String)"
      created_at: "DateTime"
      updated_at: "DateTime"
      is_current: "UInt8"

  silver_contacts:
    description: "Normalized contact profiles linked to accounts"
    source_table: "bronze_contacts"
    engine: "ReplacingMergeTree(updated_at)"
    primary_key: ["organisation_id", "contact_id"]
    order_by: ["organisation_id", "contact_id"]
    partition_by: "processing_date"
    dedup_strategy: "window_latest"
    columns:
      organisation_id: "LowCardinality(String)"
      processing_date: "Date"
      contact_id: "String"
      account_id: "String"
      first_name: "String"
      last_name: "String"
      full_name: "String"
      email: "String"
      phone: "String"
      role: "LowCardinality(String)"
      updated_at: "DateTime"

  silver_portfolios:
    description: "Normalized investment portfolios with relational account validation"
    source_table: "bronze_portfolios"
    engine: "ReplacingMergeTree(updated_at)"
    primary_key: ["organisation_id", "portfolio_id"]
    order_by: ["organisation_id", "portfolio_id"]
    partition_by: "processing_date"
    dedup_strategy: "window_latest"
    columns:
      organisation_id: "LowCardinality(String)"
      processing_date: "Date"
      portfolio_id: "String"
      account_id: "String"
      portfolio_name: "String"
      benchmark_code: "LowCardinality(String)"
      risk_tolerance: "LowCardinality(String)"
